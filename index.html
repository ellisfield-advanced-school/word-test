<style>
/* ========== 共通 ========== */
* { box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
    background: #eef2f7;
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    color: #333;
}
.app {
    --c: #4a90e2;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    padding: 24px 20px 28px;
    width: 100%;
    max-width: 440px;
}
.brand { text-align: center; font-size: 19px; font-weight: bold; margin-bottom: 8px; letter-spacing: 1px; }
h1 { font-size: 19px; text-align: center; margin: 4px 0 18px; }
.home-title { font-size: 16px; }
.center { text-align: center; }

/* ========== ボタン ========== */
.btn {
    display: block;
    width: 100%;
    background: #fff;
    color: #333;
    border: 2px solid #e0e0e0;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 12px;
    text-align: center;
    line-height: 1.4;
    font-family: inherit;
}
.btn:active { background: #f0f3f6; }
.home-btn {
    border: none;
    color: #fff;
    font-size: 20px;
    padding: 20px 14px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    box-shadow: 0 3px 8px rgba(0,0,0,0.18);
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
}
.home-btn:active { background: linear-gradient(135deg, var(--c1), var(--c2)); filter: brightness(0.92); }
.cat-btn { border-color: var(--c); }
.cat-btn:active { background: var(--c); color: #fff; }
.action-btn { background: var(--c); border-color: var(--c); color: #fff; }
.action-btn:active { background: var(--c); filter: brightness(0.92); }
.review-btn { background: #ff9800; border-color: #ff9800; color: #fff; }
.review-btn:active { background: #ff9800; filter: brightness(0.92); }
.back-btn {
    background: none; border: none; color: #666; font-size: 15px; font-weight: bold;
    padding: 6px 4px; cursor: pointer; font-family: inherit;
}
.sound-btn { max-width: 200px; margin: 0 auto 20px; padding: 10px; font-size: 16px; }

/* ========== 歴史メニュー ========== */
.search-box {
    width: 100%; padding: 12px 14px; font-size: 16px; border: 2px solid var(--c);
    border-radius: 10px; margin-bottom: 16px; font-family: inherit;
}
.lesson { border: 2px solid var(--c); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
.lesson-title { font-weight: bold; font-size: 15px; margin-bottom: 10px; line-height: 1.5; }
.lesson .btn { margin-bottom: 8px; font-size: 15px; padding: 12px; }
.lesson .btn:last-child { margin-bottom: 0; }
.no-result { text-align: center; color: #888; padding: 20px 0; }

.hit-heading { font-weight: bold; font-size: 15px; margin: 6px 0 10px; }
.hit { border: 1px solid #ddd; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 14px; line-height: 1.7; }
.hit-no { color: #888; font-size: 12px; }
.hit-answer { color: #c0392b; font-weight: bold; margin-top: 4px; }
mark { background: #fff3a0; border-radius: 3px; padding: 0 1px; }

/* ========== クイズ画面 ========== */
.quiz-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.quiz-title { font-size: 13px; color: #888; text-align: center; margin-bottom: 4px; }
.progress { color: #666; font-size: 14px; }
.japanese { font-size: 28px; font-weight: bold; margin: 20px 0; text-align: center; line-height: 1.4; }
.question-text { font-size: 18px; font-weight: bold; margin: 16px 0 20px; line-height: 1.7; text-align: left; }
.choice-btn { font-size: 18px; }
.correct { color: #2ecc71; border-color: #2ecc71 !important; background: #eafeec; }
.incorrect { color: #e74c3c; border-color: #e74c3c !important; background: #fdedec; }
.result-message { font-size: 18px; font-weight: bold; margin: 15px 0; text-align: center; min-height: 1.4em; }
.final-score { font-size: 22px; font-weight: bold; text-align: center; margin: 24px 0; }
.perfect { text-align: center; font-size: 18px; margin-bottom: 20px; }
</style>
</head>

const $app = document.getElementById("app");
const $screen = document.getElementById("screen");

function shuffle(array) {
    const a = [...array];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

/* 要素を作る小さな関数 */
function el(tag, attrs = {}, children = []) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") e.className = v;
        else if (k === "text") e.textContent = v;
        else if (k === "html") e.innerHTML = v;
        else if (k === "style") e.style.cssText = v;
        else if (k.startsWith("on")) e[k] = v;
        else e.setAttribute(k, v);
    }
    [].concat(children).forEach(c => { if (c) e.appendChild(c); });
    return e;
}

/* 画面を丸ごと入れ替える */
function mount(...nodes) {
    $screen.replaceChildren(...nodes.filter(Boolean));
    window.scrollTo(0, 0);
}

/* 検索用：全角・半角や大文字・小文字の違いを無視して比べる */
function norm(text) {
    let s = "";
    const map = [];   // 変換後の文字が、元の文字の何番目か
    for (let i = 0; i < text.length; i++) {
        for (const ch of text[i].normalize("NFKC").toLowerCase()) { s += ch; map.push(i); }
    }
    return { s, map };
}

/* 検索語に一致する部分に色をつけた文章を作る */
function highlight(text, word) {
    const { s, map } = norm(text);
    const target = norm(word).s;
    const frag = document.createDocumentFragment();
    let pos = 0, from = 0;
    while (target) {
        const k = s.indexOf(target, from);
        if (k < 0) break;
        const start = map[k], end = map[k + target.length - 1] + 1;
        if (start >= pos) {
            frag.append(text.slice(pos, start));
            frag.append(el("mark", { text: text.slice(start, end) }));
            pos = end;
        }
        from = k + target.length;
    }
    frag.append(text.slice(pos));
    return frag;
}

function setAccent(color) { $app.style.setProperty("--c", color); }

function backButton(label, onClick) {
    return el("button", { class: "back-btn", text: label, onclick: onClick });
}

/* =====================================================================
   3. 音声（iPhone・Android 両対応）
   ===================================================================== */
const Speech = (() => {
    const supported = "speechSynthesis" in window;
    let voices = [];

    function loadVoices() { voices = supported ? speechSynthesis.getVoices() : []; }
    if (supported) {
        loadVoices();
        // Android の Chrome は音声リストの読み込みが遅れるため、変化を監視する
        speechSynthesis.onvoiceschanged = loadVoices;
    }

    // 英語の音声を選ぶ（Android は "en_US" のように _ を使うことがあるので両方に対応）
    function pickVoice() {
        const english = voices.filter(v => /^en([-_]|$)/i.test(v.lang));
        return english.find(v => /^en[-_]US$/i.test(v.lang)) || english[0] || null;
    }

    // 予備：ブラウザの読み上げが使えないとき、オンライン音声を再生（通信が必要）
    function fallback(text) {
        const url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=" + encodeURIComponent(text);
        new Audio(url).play().catch(() => {
            alert("この端末では音声を再生できませんでした。Chrome などのブラウザで開いてください。");
        });
    }

    function speakNow(text) {
        const u = new SpeechSynthesisUtterance(text);
        const v = pickVoice();
        u.lang = "en-US";
        if (v) { u.voice = v; u.lang = v.lang; }
        u.rate = 0.95;
        u.onerror = e => {
            if (e.error !== "interrupted" && e.error !== "canceled") fallback(text);
        };
        speechSynthesis.resume();   // Android で一時停止状態になっている場合の対策
        speechSynthesis.speak(u);
    }

    function speak(text) {
        if (!supported) { fallback(text); return; }
        if (speechSynthesis.speaking || speechSynthesis.pending) {
            // 読み上げ中なら止めてから少し待つ（Android は cancel 直後の speak が無音になるため）
            speechSynthesis.cancel();
            setTimeout(() => speakNow(text), 150);
        } else {
            // iPhone は操作直後でないと音が出ないので、待たずにすぐ実行
            speakNow(text);
        }
    }

    return { speak };
})();

/* 読み上げ用に単語を整える */
function speechText(word) {
    let t = word.english;
    if (t === "read" && word.japanese.includes("過去")) return "red";   // 過去形の read は「レッド」
    return t
        .replace(/\([^)]*\)/g, "")        // (gotten) など括弧内を除く
        .replace(/[～~…]/g, " ")
        .replace(/’/g, "'")
        .replace(/[^\x00-\x7F]/g, " ")    // 「人」「動詞の原形」などの日本語を除く
        .replace(/\s+/g, " ")
        .trim();
}

/* =====================================================================
   4. 出題データの作成（英語・歴史とも同じ形にそろえる）
      item = { prompt, answer, choices(), speakText? }
   ===================================================================== */
function makeEnglishItems(category) {
    const pool = WORDS[category];
    return shuffle(pool).slice(0, 10).map(w => ({
        prompt: w.japanese,
        answer: w.english,
        speakText: speechText(w),
        choices() {
            const list = [w.english];
            if (w.ing) list.push(w.ing);                 // 不規則動詞：ing形も紛らわしい選択肢にする
            for (const other of shuffle(pool)) {
                if (list.length >= 4) break;
                if (!list.includes(other.english)) list.push(other.english);
            }
            return shuffle(list);
        }
    }));
}

function makeHistoryItems(lesson, mode) {
    const source = mode === "all" ? lesson.questions : shuffle(lesson.questions).slice(0, 10);
    return source.map(q => ({
        prompt: q.q,
        answer: q.a,
        choices: () => shuffle([q.a, ...q.wrong])
    }));
}

/* =====================================================================
   5. 画面：最初の画面・コース別メニュー
   ===================================================================== */
function showHome() {
    setAccent("#4a90e2");
    const list = SECTIONS.map(sec => el("button", {
        class: "btn home-btn",
        style: `--c1:${sec.c1};--c2:${sec.c2}`,
        text: `${sec.icon}  ${sec.title}`,
        onclick: () => (sec.type === "history" ? showHistoryMenu(sec) : showEnglishMenu(sec))
    }));
    mount(el("h1", { class: "home-title", text: "学習するコースを選んでね" }), ...list);
}

function showEnglishMenu(sec) {
    setAccent(sec.c1);
    const buttons = sec.categories.map(cat => el("button", {
        class: "btn cat-btn",
        text: cat,
        onclick: () => startEnglish(sec, cat)
    }));
    mount(
        backButton("← 最初の画面へ", showHome),
        el("h1", { text: sec.title }),
        ...buttons
    );
}

/* 歴史メニュー：上に検索ボックス、その下に各回のボタン
   検索すると、回の名前に合う回と、問題文・答えに合う問題が表示される */
function showHistoryMenu(sec, word = "") {
    setAccent(sec.c1);
    const listArea = el("div");
    const search = el("input", {
        class: "search-box", type: "text", autocomplete: "off", enterkeyhint: "search",
        placeholder: "🔍 検索（例：1871年、廃藩置県、第1回）"
    });
    search.value = word;

    function lessonCard(lesson, keyword) {
        const n = lesson.questions.length;
        return el("div", { class: "lesson" }, [
            el("div", { class: "lesson-title", text: `第${lesson.no}回 ${lesson.title}` }),
            el("button", {
                class: "btn cat-btn", text: `📋 全問題を順番に（${n}問）`,
                onclick: () => startHistory(sec, lesson, "all", keyword)
            }),
            el("button", {
                class: "btn cat-btn", text: `🎲 ランダム ${Math.min(10, n)}問`,
                onclick: () => startHistory(sec, lesson, "random", keyword)
            })
        ]);
    }

    let lastKeyword = null;   // 直前に表示した検索語（同じなら描き直さない）
    function renderList() {
        const keyword = search.value.trim();
        // 入力欄からボタンへ移るときに change イベントが起き、ボタンが消えて押せなくなるのを防ぐ
        if (keyword === lastKeyword) return;
        lastKeyword = keyword;
        listArea.replaceChildren();

        // 検索語が空なら、すべての回を表示
        if (!keyword) {
            HISTORY.forEach(lesson => listArea.appendChild(lessonCard(lesson, "")));
            return;
        }

        const target = norm(keyword).s;
        const lessonHits = HISTORY.filter(l => norm(`第${l.no}回 ${l.title}`).s.includes(target));
        const questionHits = [];
        HISTORY.forEach(lesson => lesson.questions.forEach((q, i) => {
            if (norm(q.q).s.includes(target) || norm(q.a).s.includes(target)) {
                questionHits.push({ lesson, no: i + 1, q });
            }
        }));

        if (lessonHits.length === 0 && questionHits.length === 0) {
            listArea.appendChild(el("div", { class: "no-result", text: "見つかりませんでした" }));
            return;
        }

        lessonHits.forEach(lesson => listArea.appendChild(lessonCard(lesson, keyword)));

        if (questionHits.length > 0) {
            listArea.appendChild(el("div", { class: "hit-heading", text: `「${keyword}」を含む問題（${questionHits.length}問）` }));
            listArea.appendChild(el("button", {
                class: "btn action-btn",
                text: `この${questionHits.length}問を出題する`,
                onclick: () => startSearchQuiz(sec, questionHits, keyword)
            }));
            questionHits.forEach(hit => {
                const question = el("div");
                question.appendChild(highlight(hit.q.q, keyword));
                const answer = el("div", { class: "hit-answer" });
                answer.append("答え：");
                answer.appendChild(highlight(hit.q.a, keyword));
                listArea.appendChild(el("div", { class: "hit" }, [
                    el("div", { class: "hit-no", text: `第${hit.lesson.no}回 問${hit.no}` }),
                    question,
                    answer
                ]));
            });
        }
    }

    // 日本語入力（変換中・確定後）でも、キーボードの種類が違っても反応するように複数のイベントを監視
    ["input", "keyup", "change", "compositionend", "search"].forEach(ev => search.addEventListener(ev, renderList));
    renderList();
    mount(
        backButton("← 最初の画面へ", showHome),
        el("h1", { text: sec.title }),
        search,
        listArea
    );
}

/* =====================================================================
   6. 出題の開始
   ===================================================================== */
function startEnglish(sec, category) {
    const opts = {
        title: category,
        kind: "english",
        color: sec.c1,
        items: makeEnglishItems(category),
        onBack: () => showEnglishMenu(sec),
        onRetry: () => startEnglish(sec, category)
    };
    runQuiz(opts);
}

function startHistory(sec, lesson, mode, keyword = "") {
    const label = mode === "all" ? "全問題（順番どおり）" : "ランダム10問";
    runQuiz({
        title: `第${lesson.no}回 ${label}`,
        kind: "history",
        color: sec.c1,
        items: makeHistoryItems(lesson, mode),
        onBack: () => showHistoryMenu(sec, keyword),
        onRetry: () => startHistory(sec, lesson, mode, keyword)
    });
}

/* 検索結果の問題だけを出題する */
function startSearchQuiz(sec, hits, keyword) {
    runQuiz({
        title: `検索「${keyword}」の問題`,
        kind: "history",
        color: sec.c1,
        items: hits.map(h => ({
            prompt: h.q.q,
            answer: h.q.a,
            choices: () => shuffle([h.q.a, ...h.q.wrong])
        })),
        onBack: () => showHistoryMenu(sec, keyword),
        onRetry: () => startSearchQuiz(sec, hits, keyword)
    });
}

/* =====================================================================
   7. クイズ本体（英語・歴史 共通）
   ===================================================================== */
function runQuiz(opts) {
    const state = { index: 0, score: 0, wrong: [], answered: false };
    setAccent(opts.color);
    showQuestion();

    function showQuestion() {
        state.answered = false;
        const item = opts.items[state.index];
        const total = opts.items.length;

        const message = el("div", { class: "result-message" });
        const nextBtn = el("button", {
            class: "btn action-btn",
            style: "display:none",
            text: state.index + 1 < total ? "次へ進む" : "結果を見る",
            onclick: () => { state.index++; state.index < total ? showQuestion() : showResult(); }
        });

        const choiceButtons = item.choices().map(text => {
            const btn = el("button", { class: "btn choice-btn", text });
            btn.onclick = () => answer(btn, text);
            return btn;
        });

        function answer(clicked, text) {
            if (state.answered) return;
            state.answered = true;
            if (text === item.answer) {
                clicked.classList.add("correct");
                message.textContent = "⭕ 正解！";
                message.style.color = "#2ecc71";
                state.score++;
            } else {
                clicked.classList.add("incorrect");
                message.textContent = `❌ 不正解！ 正解は: ${item.answer}`;
                message.style.color = "#e74c3c";
                choiceButtons.forEach(b => { if (b.textContent === item.answer) b.classList.add("correct"); });
                state.wrong.push(item);
            }
            nextBtn.style.display = "block";
        }

        const questionBlock = opts.kind === "english"
            ? el("div", { class: "japanese", html: item.prompt })
            : el("div", { class: "question-text", text: item.prompt });

        const soundBtn = item.speakText
            ? el("button", { class: "btn sound-btn", text: "🔊 発音を聞く", onclick: () => Speech.speak(item.speakText) })
            : null;

        mount(
            el("div", { class: "quiz-head" }, [
                backButton("← 戻る", opts.onBack),
                el("div", { class: "progress", text: `第 ${state.index + 1} 問 / 全 ${total} 問` })
            ]),
            el("div", { class: "quiz-title", text: opts.title }),
            questionBlock,
            soundBtn,
            el("div", {}, choiceButtons),
            message,
            nextBtn
        );
    }

    function showResult() {
        const total = opts.items.length;
        const nodes = [
            el("h1", { text: opts.review ? "誤答復習 終了！" : "テスト終了！" }),
            el("div", { class: "final-score", text: `${total} 問中 ${state.score} 問 正解！` })
        ];

        if (state.wrong.length > 0) {
            const wrongItems = state.wrong;
            nodes.push(el("button", {
                class: "btn review-btn",
                text: `✏️ 誤答復習（${wrongItems.length}問）`,
                onclick: () => runQuiz({
                    ...opts,
                    title: "誤答復習",
                    items: wrongItems,
                    review: true,
                    onRetry: () => runQuiz({ ...opts, title: "誤答復習", items: wrongItems, review: true })
                })
            }));
        } else {
            nodes.push(el("div", { class: "perfect", text: "🎉 全問正解です！" }));
        }

        nodes.push(
            el("button", { class: "btn action-btn", text: "もう一度挑戦", onclick: opts.onRetry }),
            el("button", { class: "btn", text: "← 戻る", onclick: opts.onBack })
        );
        mount(...nodes);
    }
}

/* =====================================================================
   8. 起動
   ===================================================================== */
showHome();
</script>
