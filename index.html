<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>エリスフィールド進学会 学習アプリ</title>
<style>
/* ========== 共通 ========== */
* { box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
    background: #eef2f7;
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    color: #333;
}
.app {
    --c: #4a90e2;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    padding: 24px 20px 28px;
    width: 100%;
    max-width: 440px;
}
.brand { text-align: center; font-size: 19px; font-weight: bold; margin-bottom: 8px; letter-spacing: 1px; }
h1 { font-size: 19px; text-align: center; margin: 4px 0 18px; }
.home-title { font-size: 16px; }
.version { text-align: center; font-size: 11px; color: #aaa; margin-top: 14px; }
.center { text-align: center; }

/* ========== ボタン ========== */
.btn {
    display: block;
    width: 100%;
    background: #fff;
    color: #333;
    border: 2px solid #e0e0e0;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 12px;
    text-align: center;
    line-height: 1.4;
    font-family: inherit;
}
.btn:active { background: #f0f3f6; }
.home-btn {
    border: none;
    color: #fff;
    font-size: 20px;
    padding: 20px 14px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    box-shadow: 0 3px 8px rgba(0,0,0,0.18);
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
}
.home-btn:active { background: linear-gradient(135deg, var(--c1), var(--c2)); filter: brightness(0.92); }
.cat-btn { border-color: var(--c); }
.cat-btn:active { background: var(--c); color: #fff; }
.action-btn { background: var(--c); border-color: var(--c); color: #fff; }
.action-btn:active { background: var(--c); filter: brightness(0.92); }
.review-btn { background: #ff9800; border-color: #ff9800; color: #fff; }
.review-btn:active { background: #ff9800; filter: brightness(0.92); }
.back-btn {
    background: none; border: none; color: #666; font-size: 15px; font-weight: bold;
    padding: 6px 4px; cursor: pointer; font-family: inherit;
}
.sound-btn { max-width: 200px; margin: 0 auto 20px; padding: 10px; font-size: 16px; }
.speech-note { font-size: 12px; color: #c0392b; line-height: 1.6; text-align: left; margin: -8px 0 14px; }
.speech-note:empty { display: none; }

/* ========== 歴史メニュー ========== */
.search-box {
    width: 100%; padding: 12px 14px; font-size: 16px; border: 2px solid var(--c);
    border-radius: 10px; margin-bottom: 16px; font-family: inherit;
}
.no-result { text-align: center; color: #888; padding: 20px 0; }

.hit-heading { font-weight: bold; font-size: 15px; margin: 6px 0 10px; }
.hit { border: 1px solid #ddd; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 14px; line-height: 1.7; }
.hit-no { color: #888; font-size: 12px; }
.hit-answer { color: #c0392b; font-weight: bold; margin-top: 4px; }
mark { background: #fff3a0; border-radius: 3px; padding: 0 1px; }

/* ========== 語句整序 ========== */
.mix-btn { background: #e67e22; border-color: #e67e22; color: #fff; }
.mix-btn:active { background: #e67e22; filter: brightness(0.92); }
.question-box {
    font-size: 18px; font-weight: bold; line-height: 1.6; margin: 16px 0;
    text-align: left; padding: 14px; background: #f8f9fa;
    border-left: 5px solid var(--c); border-radius: 4px;
}
.section-label { font-size: 12px; color: #7f8c8d; text-align: left; margin-bottom: 2px; font-weight: bold; }
.answer-area, .word-pool {
    border-radius: 8px; min-height: 76px; margin: 0 0 14px; padding: 10px;
    display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; background: #fff;
}
.answer-area { border: 2px dashed #bdc3c7; }
.word-pool { border: 2px solid var(--c); }
.word {
    background: #ecf0f1; border: 1px solid #bdc3c7; border-radius: 20px;
    padding: 8px 16px; font-size: 16px; cursor: pointer; user-select: none;
}
.word:active { background: #d6dbdf; }
/* 解答エリアの最初の単語だけ、見た目上1文字目を大文字にする */
.answer-area .word:first-child::first-letter { text-transform: uppercase; }
.control-btns { display: flex; gap: 12px; margin-top: 8px; }
.control-btns .btn { margin-bottom: 0; }
.reset-btn { background: #95a5a6; border-color: #95a5a6; color: #fff; }
.reset-btn:active { background: #95a5a6; filter: brightness(0.92); }
.submit-btn { background: #2ecc71; border-color: #2ecc71; color: #fff; }
.submit-btn:active { background: #2ecc71; filter: brightness(0.92); }
.review-zone {
    max-height: 260px; overflow-y: auto; margin-bottom: 18px; border: 1px solid #e1e8ed;
    padding: 6px 10px; border-radius: 8px; background: #fafbfc; text-align: left;
}
.review-item { border-bottom: 1px solid #ecf0f1; padding: 8px 0; font-size: 14px; line-height: 1.6; }
.review-item:last-child { border-bottom: none; }
.review-q { font-weight: bold; }
.review-a { color: #27ae60; }
.review-w { color: #e74c3c; }
.comment { text-align: center; font-weight: bold; margin-bottom: 18px; }

/* ========== クイズ画面 ========== */
.quiz-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.quiz-title { font-size: 13px; color: #888; text-align: center; margin-bottom: 4px; }
.progress { color: #666; font-size: 14px; }
.japanese { font-size: 28px; font-weight: bold; margin: 20px 0; text-align: center; line-height: 1.4; }
.question-text { font-size: 18px; font-weight: bold; margin: 16px 0 20px; line-height: 1.7; text-align: left; }
.choice-btn { font-size: 18px; }
.lookup { margin-top: 22px; border: 1px solid #e1e8ed; border-radius: 10px; padding: 10px 12px; background: #fafbfc; }
.lookup summary { font-weight: bold; font-size: 14px; cursor: pointer; color: #555; }
.lookup .search-box { margin: 12px 0 10px; }
.lookup-buttons { display: flex; gap: 8px; }
.lookup-buttons .btn { margin-bottom: 0; font-size: 14px; padding: 10px 4px; }
.lookup-note { font-size: 12px; color: #c0392b; line-height: 1.6; margin-top: 8px; text-align: left; }
.lookup-note:empty { display: none; }
.lookup-help { font-size: 11px; color: #888; line-height: 1.6; margin-top: 8px; }
.choice-btn.selected { border-color: var(--c); background: #f3f8ff; }
.btn:disabled { opacity: 0.45; cursor: default; }
.correct { color: #2ecc71; border-color: #2ecc71 !important; background: #eafeec; }
.incorrect { color: #e74c3c; border-color: #e74c3c !important; background: #fdedec; }
.result-message { font-size: 18px; font-weight: bold; margin: 15px 0; text-align: center; min-height: 1.4em; }
.final-score { font-size: 22px; font-weight: bold; text-align: center; margin: 24px 0; }
.perfect { text-align: center; font-size: 18px; margin-bottom: 20px; }
</style>

const $app = document.getElementById("app");
const $screen = document.getElementById("screen");

function shuffle(array) {
    const a = [...array];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

/* 要素を作る小さな関数 */
function el(tag, attrs = {}, children = []) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") e.className = v;
        else if (k === "text") e.textContent = v;
        else if (k === "html") e.innerHTML = v;
        else if (k === "style") e.style.cssText = v;
        else if (k.startsWith("on")) e[k] = v;
        else e.setAttribute(k, v);
    }
    [].concat(children).forEach(c => { if (c) e.appendChild(c); });
    return e;
}

/* 画面を丸ごと入れ替える */
function mount(...nodes) {
    $screen.replaceChildren(...nodes.filter(Boolean));
    window.scrollTo(0, 0);
}

/* 検索用：全角・半角や大文字・小文字の違いを無視して比べる */
function norm(text) {
    let s = "";
    const map = [];   // 変換後の文字が、元の文字の何番目か
    for (let i = 0; i < text.length; i++) {
        for (const ch of text[i].normalize("NFKC").toLowerCase()) { s += ch; map.push(i); }
    }
    return { s, map };
}

/* 検索語に一致する部分に色をつけた文章を作る */
function highlight(text, word) {
    const { s, map } = norm(text);
    const target = norm(word).s;
    const frag = document.createDocumentFragment();
    let pos = 0, from = 0;
    while (target) {
        const k = s.indexOf(target, from);
        if (k < 0) break;
        const start = map[k], end = map[k + target.length - 1] + 1;
        if (start >= pos) {
            frag.append(text.slice(pos, start));
            frag.append(el("mark", { text: text.slice(start, end) }));
            pos = end;
        }
        from = k + target.length;
    }
    frag.append(text.slice(pos));
    return frag;
}

/* =====================================================================
   3. 音声（iPhone・Android 両対応）
   ===================================================================== */
const Speech = (() => {
    const isSupported = () => "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
    let voices = [];

    function loadVoices() { voices = isSupported() ? speechSynthesis.getVoices() : []; }
    if (isSupported()) {
        loadVoices();
        // Android の Chrome は音声リストの読み込みが遅れるため、変化を監視する
        speechSynthesis.onvoiceschanged = loadVoices;
    }

    // 英語の音声を選ぶ（Android は "en_US" のように _ を使うことがあるので両方に対応）
    // 通信が必要な音声より、端末内の音声（localService）を優先する
    function pickVoice() {
        const english = voices.filter(v => /^en([-_]|$)/i.test(v.lang));
        const local = english.filter(v => v.localService);
        const list = local.length ? local : english;
        return list.find(v => /^en[-_]US$/i.test(v.lang)) || list[0] || null;
    }

    // 使っているブラウザの名前（案内メッセージ用）
    function browserName() {
        const ua = navigator.userAgent;
        if (/Line\//i.test(ua)) return "LINE";
        if (/Instagram|FBAN|FBAV/i.test(ua)) return "アプリ内ブラウザ";
        if (/SamsungBrowser/i.test(ua)) return "Samsung Internet";
        if (/Firefox|FxiOS/i.test(ua)) return "Firefox";
        if (/EdgA|EdgiOS/i.test(ua)) return "Edge";
        if (/OPR|Opera/i.test(ua)) return "Opera";
        if (/; wv\)/.test(ua)) return "アプリ内ブラウザ";
        if (/Chrome|CriOS/i.test(ua)) return "Chrome";
        return "不明";
    }

    // 読み上げの試し方。うまくいかなければ、次の方法を順に試す
    const attempts = [
        u => { u.lang = "en-US"; },
        u => { const v = pickVoice(); u.lang = v ? v.lang : "en-US"; if (v) u.voice = v; },
        u => { u.lang = "en"; }
    ];

    const HELP = "端末の「テキスト読み上げ」に英語の音声データが入っていない可能性があります。" +
        "設定 →「言語と入力」（または「ユーザー補助」）→「テキスト読み上げの出力」→ " +
        "Google テキスト読み上げエンジン（歯車）→「音声データをインストール」→ 英語（米国）を入れてから、もう一度押してください。";

    // 最後の手段：オンライン音声（通信が必要。非公式の方法のため使えないこともある）
    function fallback(text, reason, notify) {
        const audio = new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=" + encodeURIComponent(text));
        audio.referrerPolicy = "no-referrer";
        const fail = () => {
            if (!notify) return;
            if (reason === "非対応のブラウザ") {
                const name = browserName();
                notify(name === "Chrome"
                    ? "Chrome の読み上げ機能が使えない状態です。Chrome を最新版に更新し、タブをすべて閉じて開き直してください。"
                    : `このブラウザ（${name}）では英語の音声が使えません。Google Chrome で開き直してください。`);
            } else {
                notify(`音声を再生できませんでした（${reason || "不明"}／${browserName()}）。${HELP}`);
            }
        };
        audio.onerror = fail;
        audio.play().catch(fail);
    }

    function attempt(text, i, notify, reason) {
        if (i >= attempts.length) { fallback(text, reason, notify); return; }
        const u = new SpeechSynthesisUtterance(text);
        attempts[i](u);
        u.rate = 0.8;
        let started = false, moved = false;
        const next = why => { if (!moved) { moved = true; attempt(text, i + 1, notify, why); } };
        u.onstart = () => { started = true; };
        u.onerror = e => {
            if (e.error === "interrupted" || e.error === "canceled") return;
            next(e.error);
        };
        // エラーも音も出ないまま止まる端末への対策：3秒たっても始まらなければ次の方法へ
        setTimeout(() => {
            if (!started && !moved) { speechSynthesis.cancel(); next(reason || "反応なし"); }
        }, 3000);
        speechSynthesis.resume();   // Android で一時停止状態になっている場合の対策
        speechSynthesis.speak(u);
    }

    function speak(text, notify) {
        if (notify) notify("");
        if (!isSupported()) { fallback(text, "非対応のブラウザ", notify); return; }
        if (speechSynthesis.speaking || speechSynthesis.pending) {
            // 読み上げ中なら止めてから少し待つ（Android は cancel 直後の speak が無音になるため）
            speechSynthesis.cancel();
            setTimeout(() => attempt(text, 0, notify), 150);
        } else {
            // iPhone は操作直後でないと音が出ないので、待たずにすぐ実行
            attempt(text, 0, notify);
        }
    }

    return { speak };
})();

/* 読み上げ用に単語を整える */
function speechText(word) {
    let t = word.english;
    if (t === "read" && word.japanese.includes("過去")) return "red";   // 過去形の read は「レッド」
    return t
        .replace(/\([^)]*\)/g, "")        // (gotten) など括弧内を除く
        .replace(/[～~…]/g, " ")
        .replace(/’/g, "'")
        .replace(/[^\x00-\x7F]/g, " ")    // 「人」「動詞の原形」などの日本語を除く
        .replace(/\s+/g, " ")
        .trim();
}

/* =====================================================================
   4. 出題データの作成（英語・歴史とも同じ形にそろえる）
      item = { prompt, answer, choices(), speakText? }
   ===================================================================== */
function makeEnglishItems(category) {
    const pool = WORDS[category];
    return shuffle(pool).slice(0, 10).map(w => ({
        prompt: w.japanese,
        answer: w.english,
        speakText: speechText(w),
        choices() {
            const list = [w.english];
            if (w.ing) list.push(w.ing);                 // 不規則動詞：ing形も紛らわしい選択肢にする
            for (const other of shuffle(pool)) {
                if (list.length >= 4) break;
                if (!list.includes(other.english)) list.push(other.english);
            }
            return shuffle(list);
        }
    }));
}

function makeHistoryItems(lesson, mode) {
    const source = mode === "all" ? lesson.questions : shuffle(lesson.questions).slice(0, 10);
    return source.map(q => ({
        prompt: q.q,
        answer: q.a,
        choices: () => shuffle([q.a, ...q.wrong])
    }));
}

/* ---- 年代問題 ----
   ①年→できごと：「〇〇年に起こったできごとを選びなさい」（同じ年のできごとが2つ以上あれば、2つ選ぶ）
   ②できごと→年：「〇〇は何年のできごとか」 */
function yearToEvents(year, scope, all) {
    const correct = shuffle(scope.filter(d => d.y === year)).slice(0, 2).map(d => d.e);
    const other = d => d.y !== year;   // 同じ年のできごとは、まちがいの選択肢に入れない
    const wrongPool = [...new Set([...shuffle(scope.filter(other)), ...shuffle(all.filter(other))].map(d => d.e))]
        .filter(e => !correct.includes(e));
    const wrong = wrongPool.slice(0, 4 - correct.length);
    const base = {
        prompt: `${year}年に起こったできごとを、次から${correct.length}つ選びなさい。`,
        choices: () => shuffle([...correct, ...wrong])
    };
    return correct.length > 1 ? { ...base, answers: correct } : { ...base, answer: correct[0] };
}

function eventToYear(d, all) {
    const near = new Set();
    const known = [...new Set(all.map(x => x.y))].filter(v => v !== d.y && Math.abs(v - d.y) <= 8);
    shuffle(known).forEach(v => { if (near.size < 3) near.add(v); });
    for (let k = 1; near.size < 3; k++) {
        shuffle([d.y - k, d.y + k]).forEach(v => { if (near.size < 3 && v <= 2026) near.add(v); });
    }
    const years = [d.y, ...near].sort((a, b) => a - b).map(v => `${v}年`);
    return { prompt: `${d.e}は何年のできごとか。`, answer: `${d.y}年`, choices: () => years };
}

/* lessonNo が null なら全範囲。①を約4割、②を約6割まぜて10問作る */
function makeYearItems(dates, lessonNo, count = 10) {
    const scope = dates.filter(d => lessonNo == null || d.l.includes(lessonNo));
    const years = [...new Set(scope.map(d => d.y))];
    const typeA = shuffle(years).map(y => yearToEvents(y, scope, dates));
    const typeB = shuffle(scope).map(d => eventToYear(d, dates));
    const nA = Math.min(typeA.length, Math.ceil(count * 0.4));
    const picked = [...typeA.slice(0, nA), ...typeB.slice(0, count - nA)];
    if (picked.length < count) picked.push(...typeA.slice(nA, nA + count - picked.length));
    return shuffle(picked).slice(0, count);
}

function yearQuizSize(dates, lessonNo) {
    const scope = dates.filter(d => lessonNo == null || d.l.includes(lessonNo));
    return Math.min(10, new Set(scope.map(d => d.y)).size + scope.length);
}

/* 検索ボックス。入力のたびに render(検索語) を呼ぶ（日本語入力・スマホのキーボードにも対応） */
function makeSearchBox(placeholder, word, render) {
    const input = el("input", {
        class: "search-box", type: "text", autocomplete: "off", enterkeyhint: "search", placeholder
    });
    input.value = word;
    let last = null;   // 直前に表示した検索語（同じなら描き直さない。ボタンを押した瞬間に消えるのを防ぐ）
    const run = () => {
        const keyword = input.value.trim();
        if (keyword === last) return;
        last = keyword;
        render(keyword);
    };
    ["input", "keyup", "change", "compositionend", "search"].forEach(ev => input.addEventListener(ev, run));
    run();
    return input;
}

/* 問題文または答えに検索語を含む問題を探す */
function findHits(lessons, keyword) {
    const target = norm(keyword).s;
    const hits = [];
    lessons.forEach(lesson => lesson.questions.forEach((q, i) => {
        if (norm(q.q).s.includes(target) || norm(q.a).s.includes(target)) hits.push({ lesson, no: i + 1, q });
    }));
    return hits;
}

/* 検索結果の表示（見出し・出題ボタン・問題と答え） */
function hitNodes(sec, hits, keyword, showLesson, onBack) {
    const nodes = [
        el("div", { class: "hit-heading", text: `「${keyword}」を含む問題（${hits.length}問）` }),
        el("button", {
            class: "btn action-btn",
            text: `この${hits.length}問を出題する`,
            onclick: () => startSearchQuiz(sec, hits, keyword, onBack)
        })
    ];
    hits.forEach(hit => {
        const question = el("div");
        question.appendChild(highlight(hit.q.q, keyword));
        const answer = el("div", { class: "hit-answer" });
        answer.append("答え：");
        answer.appendChild(highlight(hit.q.a, keyword));
        nodes.push(el("div", { class: "hit" }, [
            el("div", { class: "hit-no", text: showLesson ? `第${hit.lesson.no}回　問${hit.no}` : `問${hit.no}` }),
            question,
            answer
        ]));
    });
    return nodes;
}

const noResult = () => el("div", { class: "no-result", text: "見つかりませんでした" });

/* ①回の一覧：上に検索ボックス、その下に「第〇回　タイトル」のボタン */
function showHistoryMenu(sec, word = "") {
    setAccent(sec.c1);
    const listArea = el("div");
    const lessonButton = lesson => el("button", {
        class: "btn cat-btn",
        text: `第${lesson.no}回　${lesson.title}`,
        onclick: () => showHistoryLesson(sec, lesson, "", search.value.trim())
    });

    const search = makeSearchBox(`🔍 検索（例：${sec.searchExample}）`, word, keyword => {
        listArea.replaceChildren();
        if (!keyword) {
            if (sec.dates) {
                listArea.appendChild(el("button", {
                    class: "btn action-btn",
                    text: "🕰 年代問題（全範囲 ランダム10問）",
                    onclick: () => startYearQuiz(sec, null, () => showHistoryMenu(sec, search.value.trim()))
                }));
            }
            sec.lessons.forEach(lesson => listArea.appendChild(lessonButton(lesson)));
            return;
        }
        const target = norm(keyword).s;
        const lessonHits = sec.lessons.filter(l => norm(`第${l.no}回 ${l.title}`).s.includes(target));
        const hits = findHits(sec.lessons, keyword);
        if (lessonHits.length === 0 && hits.length === 0) {
            listArea.appendChild(noResult());
            return;
        }
        lessonHits.forEach(lesson => listArea.appendChild(lessonButton(lesson)));
        if (hits.length > 0) {
            hitNodes(sec, hits, keyword, true, () => showHistoryMenu(sec, keyword))
                .forEach(node => listArea.appendChild(node));
        }
    });

    mount(
        backButton("← 最初の画面へ", showHome),
        el("h1", { text: sec.title }),
        search,
        listArea
    );
}

/* ②回の画面：出題ボタン（全問題・ランダム10問）と、この回の中の検索ボックス

/* 固有名詞（文頭でも小文字にしない語） */
const PROPER_NOUNS = [
    "I", "Tokyo", "Kyoto", "Hokkaido", "Okinawa", "Fukuoka", "Tom", "Ken", "Yumi", "Mary", "Amy", "Kaito",
    "Mr. Green", "Columbus", "English", "Japanese", "French", "Chinese", "America", "Hawaii", "Africa",
    "Canada", "France", "Mt. Fuji", "Christmas", "Happy Birthday", "Christmas cards", "TV", "Friday", "Kabuki"
];
const isProperNoun = word => PROPER_NOUNS.includes(word) || /^[A-Z][a-z]+'s\b/.test(word) && PROPER_NOUNS.some(n => word.startsWith(n));

/* 語句を「選ぶボタン」にする。文頭の語は、固有名詞でなければ小文字で見せる */
function makeTokens(words) {
    return words.map((w, i) => ({
        w,
        shown: i === 0 && !isProperNoun(w) ? w.charAt(0).toLowerCase() + w.slice(1) : w
    }));
}

/* 結果の表示用に、語句をつないで1つの文にする（先頭を大文字にし、記号の前の空白を詰める） */
function sentenceOf(shownWords) {
    const s = shownWords.join(" ").replace(/ ([.?!,])/g, "$1");
    return s.charAt(0).toUpperCase() + s.slice(1);
}

function runOrder(opts) {
    const state = { index: 0, score: 0, wrong: [], records: [] };
    setAccent(opts.color);
    showQuestion();

    function showQuestion() {
        const item = opts.items[state.index];
        const total = opts.items.length;
        let picked = [];
        let pool = shuffle(makeTokens(item.words));

        const answerZone = el("div", { class: "answer-area" });
        const poolZone = el("div", { class: "word-pool" });
        const chip = (token, onclick) => el("span", { class: "word", role: "button", text: token.shown, onclick });

        function draw() {
            answerZone.replaceChildren(...picked.map((token, i) =>
                chip(token, () => { pool.push(picked.splice(i, 1)[0]); draw(); })));
            poolZone.replaceChildren(...pool.map((token, i) =>
                chip(token, () => { picked.push(pool.splice(i, 1)[0]); draw(); })));
        }

        function reset() {
            picked = [];
            pool = shuffle(makeTokens(item.words));
            draw();
        }

        function submit() {
            const ok = picked.map(t => t.w).join(" ") === item.words.join(" ");
            if (ok) state.score++; else state.wrong.push(item);
            state.records.push({
                ja: item.ja,
                ok,
                correct: sentenceOf(makeTokens(item.words).map(t => t.shown)),
                user: picked.length ? sentenceOf(picked.map(t => t.shown)) : "（空欄）"
            });
            state.index++;
            state.index < total ? showQuestion() : showResult();
        }

        draw();
        mount(
            el("div", { class: "quiz-head" }, [
                backButton("← 戻る", opts.onBack),
                el("div", { class: "progress", text: `第 ${state.index + 1} 問 / 全 ${total} 問` })
            ]),
            el("div", { class: "quiz-title", text: opts.title }),
            el("div", { class: "question-box", text: item.label ? `[${item.label}] ${item.ja}` : item.ja }),
            el("div", { class: "section-label", text: "【解答エリア】" }),
            answerZone,
            el("div", { class: "section-label", text: "【選択肢】（タップして移動）" }),
            poolZone,
            el("div", { class: "control-btns" }, [
                el("button", { class: "btn reset-btn", text: "リセット", onclick: reset }),
                el("button", { class: "btn submit-btn", text: "決定", onclick: submit })
            ])
        );
    }

    function showResult() {
        const total = opts.items.length;
        const percent = state.score / total * 100;
        const comment =
            percent === 100 ? "素晴らしい！満点です！💯" :
            percent >= 80 ? "お見事！あともう少しです！👍" :
            percent >= 50 ? "ナイスファイト！復習してもう一度挑戦しよう！" :
                            "一歩ずつ進みましょう！次はもっと取れるはずです！";

        const review = el("div", { class: "review-zone" }, state.records.map((r, i) =>
            el("div", { class: "review-item" }, [
                el("div", { class: "review-q", text: `${i + 1}. ${r.ja} ${r.ok ? "✅" : "❌"}` }),
                el("div", { class: "review-a", text: `正解: ${r.correct}` }),
                r.ok ? null : el("div", { class: "review-w", text: `解答: ${r.user}` })
            ])));

        const nodes = [
            el("h1", { text: opts.review ? "誤答復習 終了！" : "テスト終了！" }),
            el("div", { class: "final-score", text: `${total} 問中 ${state.score} 問 正解！` }),
            el("div", { class: "comment", text: comment }),
            review
        ];

        if (state.wrong.length > 0) {
            const wrongItems = state.wrong;
            const reviewOpts = { ...opts, title: "誤答復習", items: wrongItems, review: true };
            reviewOpts.onRetry = () => runOrder(reviewOpts);
            nodes.push(el("button", {
                class: "btn review-btn",
                text: `✏️ 誤答復習（${wrongItems.length}問）`,
                onclick: () => runOrder(reviewOpts)
            }));
        }
        nodes.push(
            el("button", { class: "btn action-btn", text: "もう一度挑戦", onclick: opts.onRetry }),
            el("button", { class: "btn", text: "← 戻る", onclick: opts.onBack })
        );
        mount(...nodes);
    }
}

/* =====================================================================
   6. 出題の開始
   ===================================================================== */
function startEnglish(sec, category) {
    const opts = {
        title: category,
        kind: "english",
        color: sec.c1,
        items: makeEnglishItems(category),
        onBack: () => showEnglishMenu(sec),
        onRetry: () => startEnglish(sec, category)
    };
    runQuiz(opts);
}

function startHistory(sec, lesson, mode, onBack) {
    const label = mode === "all" ? "全問題（順番どおり）" : "ランダム10問";
    runQuiz({
        title: `第${lesson.no}回　${label}`,
        kind: "history",
        lookupPrompt: sec.lookupPrompt,
        lookupExample: sec.lookupExample,
        color: sec.c1,
        items: makeHistoryItems(lesson, mode),
        onBack,
        onRetry: () => startHistory(sec, lesson, mode, onBack)
    });
}

/* 年代問題を出題する（lessonNo が null なら全範囲） */
function startYearQuiz(sec, lessonNo, onBack) {
    runQuiz({
        title: lessonNo == null ? "年代問題（全範囲 ランダム10問）" : `第${lessonNo}回　年代問題`,
        kind: "history",
        lookupPrompt: sec.lookupPrompt,
        lookupExample: sec.lookupExample,
        color: sec.c1,
        items: makeYearItems(sec.dates, lessonNo),
        onBack,
        onRetry: () => startYearQuiz(sec, lessonNo, onBack)
    });
}

/* 検索結果の問題だけを出題する */
function startSearchQuiz(sec, hits, keyword, onBack) {
    runQuiz({
        title: `検索「${keyword}」の問題`,
        kind: "history",
        lookupPrompt: sec.lookupPrompt,
        lookupExample: sec.lookupExample,
        color: sec.c1,
        items: hits.map(h => ({
            prompt: h.q.q,
            answer: h.q.a,
            choices: () => shuffle([h.q.a, ...h.q.wrong])
        })),
        onBack,
        onRetry: () => startSearchQuiz(sec, hits, keyword, onBack)
    });
}

/* =====================================================================
   7. クイズ本体（英語・歴史 共通）
   ===================================================================== */
function runQuiz(opts) {
    const state = { index: 0, score: 0, wrong: [], answered: false };
    setAccent(opts.color);
    showQuestion();

    function showQuestion() {
        state.answered = false;
        const item = opts.items[state.index];
        const total = opts.items.length;

        const message = el("div", { class: "result-message" });
        const nextBtn = el("button", {
            class: "btn action-btn",
            style: "display:none",
            text: state.index + 1 < total ? "次へ進む" : "結果を見る",
            onclick: () => { state.index++; state.index < total ? showQuestion() : showResult(); }
        });

        const answers = item.answers || [item.answer];   // 正解（「2つ選ぶ」問題では2つ）
        const multi = answers.length > 1;
        const selected = [];                              // 選択中のボタン（2つ選ぶ問題のとき）

        const choiceButtons = item.choices().map(text => {
            const btn = el("button", { class: "btn choice-btn", text });
            btn.onclick = () => (multi ? toggle(btn) : judge([btn]));
            return btn;
        });

        // 2つ選ぶ問題：タップで選択・解除し、必要な数が選ばれたら「決定」を押せる
        const submitBtn = multi
            ? el("button", { class: "btn action-btn", text: "決定", onclick: () => judge(selected) })
            : null;
        if (submitBtn) submitBtn.disabled = true;

        function toggle(btn) {
            if (state.answered) return;
            const i = selected.indexOf(btn);
            if (i >= 0) {
                selected.splice(i, 1);
                btn.classList.remove("selected");
            } else {
                selected.push(btn);
                btn.classList.add("selected");
                if (selected.length > answers.length) selected.shift().classList.remove("selected");
            }
            submitBtn.disabled = selected.length !== answers.length;
        }

        function judge(chosen) {
            if (state.answered) return;
            state.answered = true;
            const texts = chosen.map(b => b.textContent);
            const ok = texts.length === answers.length && answers.every(a => texts.includes(a));
            chosen.forEach(b => b.classList.remove("selected"));
            choiceButtons.forEach(b => { if (answers.includes(b.textContent)) b.classList.add("correct"); });
            if (ok) {
                message.textContent = "⭕ 正解！";
                message.style.color = "#2ecc71";
                state.score++;
            } else {
                chosen.forEach(b => { if (!answers.includes(b.textContent)) b.classList.add("incorrect"); });
                message.textContent = `❌ 不正解！ 正解は: ${answers.join("、")}`;
                message.style.color = "#e74c3c";
                state.wrong.push(item);
            }
            if (submitBtn) submitBtn.style.display = "none";
            nextBtn.style.display = "block";
        }

        const questionBlock = opts.kind === "english"
            ? el("div", { class: "japanese", html: item.prompt })
            : el("div", { class: "question-text", text: item.prompt });

        const speechNote = el("div", { class: "speech-note" });
        const soundBtn = item.speakText
            ? el("button", {
                class: "btn sound-btn", text: "🔊 発音を聞く",
                onclick: () => Speech.speak(item.speakText, msg => { speechNote.textContent = msg; })
            })
            : null;

        mount(
            el("div", { class: "quiz-head" }, [
                backButton("← 戻る", opts.onBack),
                el("div", { class: "progress", text: `第 ${state.index + 1} 問 / 全 ${total} 問` })
            ]),
            el("div", { class: "quiz-title", text: opts.title }),
            questionBlock,
            soundBtn,
            soundBtn ? speechNote : null,
            el("div", {}, choiceButtons),
            submitBtn,
            message,
            nextBtn,
            opts.lookupPrompt ? termLookup(opts.lookupPrompt, opts.lookupExample) : null
        );
    }

    function showResult() {
        const total = opts.items.length;
        const nodes = [
            el("h1", { text: opts.review ? "誤答復習 終了！" : "テスト終了！" }),
            el("div", { class: "final-score", text: `${total} 問中 ${state.score} 問 正解！` })
        ];

        if (state.wrong.length > 0) {
            const wrongItems = state.wrong;
            nodes.push(el("button", {
                class: "btn review-btn",
                text: `✏️ 誤答復習（${wrongItems.length}問）`,
                onclick: () => runQuiz({
                    ...opts,
                    title: "誤答復習",
                    items: wrongItems,
                    review: true,
                    onRetry: () => runQuiz({ ...opts, title: "誤答復習", items: wrongItems, review: true })
                })
            }));
        } else {
            nodes.push(el("div", { class: "perfect", text: "🎉 全問正解です！" }));
        }

        nodes.push(
            el("button", { class: "btn action-btn", text: "もう一度挑戦", onclick: opts.onRetry }),
            el("button", { class: "btn", text: "← 戻る", onclick: opts.onBack })
        );
        mount(...nodes);
    }
}

/* =====================================================================
   8. 起動
   ===================================================================== */
// コースの種類ごとに、開く画面を決める
const SCREENS = { english: showEnglishMenu, order: showOrderMenu, lessons: showHistoryMenu };

showHome();
